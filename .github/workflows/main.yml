name: Build OpenGlass Windows Binaries

on:
  workflow_dispatch:

jobs:
  build:
    # Changed from windows-2022 to windows-2025 to enable the native v145 toolset
    runs-on: windows-2025

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Source Zip
      run: |
        $zipFile = Get-ChildItem -Filter *.zip | Select-Object -First 1
        if ($zipFile) {
            Write-Host "Extracting $($zipFile.Name)..."
            Expand-Archive -Path $zipFile.FullName -DestinationPath "." -Force
        }
        $subFolder = Get-ChildItem -Directory | Where-Object { $_.Name -like "*OpenGlass*" } | Select-Object -First 1
        if ($subFolder) {
            Write-Host "Flattening directory structure out of $($subFolder.Name)..."
            Move-Item -Path "$($subFolder.FullName)\*" -Destination "." -Force -ErrorAction SilentlyContinue
        }

    - name: Setup MSBuild Toolchain
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet Command Line
      uses: nuget/setup-nuget@v2

    - name: Run Package Manager Restores
      run: |
        nuget restore OpenGlass.slnx
        vcpkg integrate install
        vcpkg install --triplet=x64-windows

    - name: Run Windows C++ MSBuild Engine
      run: |
        # Runs natively on the v145 environment matching your project definition
        msbuild OpenGlass.slnx /p:Configuration=Release /p:Platform=x64
        
    - name: Upload Windows Binaries (.dll & .exe)
      uses: actions/upload-artifact@v4
      with:
        name: OpenGlass-Windows-Binaries
        path: |
          **/Release/*.dll
          **/Release/*.exe
